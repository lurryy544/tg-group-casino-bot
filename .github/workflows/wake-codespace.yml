name: Wake Codespace

on:
  schedule:
    - cron: '*/40 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake codespace via API
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/codespaces/${{ vars.CODESPACE_NAME }}/start" || true